
# ===================================================================
    # 1. APPLICATION & SERVER CONFIGURATION
    # ===================================================================
    spring.application.name=e-commerce-api
    server.port=8080
    server.servlet.context-path=/
    
    # ===================================================================
    # 2. DATASOURCE CONFIGURATION (PostgreSQL)
    # ===================================================================
    # JDBC URL pointing to your PostgreSQL database (ecommerce_db)
    spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    spring.datasource.username=${DB_USERNAME:postgres}
    spring.datasource.password=${DB_PASSWORD:postgres}
    spring.datasource.driver-class-name=org.postgresql.Driver
    
    # Connection Pool (HikariCP) settings
    spring.datasource.hikari.maximum-pool-size=10
    spring.datasource.hikari.minimum-idle=5
    spring.datasource.hikari.idle-timeout=300000
    spring.datasource.hikari.connection-timeout=20000
    
    # ===================================================================
    # 3. JPA / HIBERNATE CONFIGURATION
    # ===================================================================
    spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
    
    # Use 'validate' or 'none' if using manual SQL scripts (01_create_database.sql) or Flyway.
    # Use 'update' during early development if you want Hibernate to auto-create missing tables.
    spring.jpa.hibernate.ddl-auto=validate
    
    # Show executed SQL queries in logs (useful during development)
    spring.jpa.show-sql=true
    spring.jpa.properties.hibernate.format_sql=true
    spring.jpa.properties.hibernate.highlight_sql=true
    
    # ===================================================================
    # 4. FLYWAY MIGRATION CONFIGURATION
    # ===================================================================
    # Controls Flyway database migrations
    spring.flyway.enabled=true
    spring.flyway.baseline-on-migrate=true
    spring.flyway.locations=classpath:db/migration
    
    # ===================================================================
    # 5. SPRING SESSION (JDBC) CONFIGURATION
    # ===================================================================
    spring.session.store-type=jdbc
    spring.session.jdbc.initialize-schema=always
    spring.session.timeout=1800s
    
    # ===================================================================
    # 6. JSON / JACKSON FORMATTING
    # ===================================================================
    spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'
    spring.jackson.time-zone=UTC

    # ===================================================================
    # 7. RFC 7807 PROBLEM DETAILS
    # ===================================================================
    spring.mvc.problemdetails.enabled=true
# ──────
  ### 🚀 How to Set It Up Step-by-Step

#   1. Create the Database in PostgreSQL:
#   Ensure PostgreSQL is running locally on port 5432 and create the database ecommerce_db:
#     psql -U postgres -c "CREATE DATABASE ecommerce_db;"

#   2. Execute Database Scripts (Optional / Manual Setup):
#   If you are running the database setup manually prior to running the app:
#     psql -U postgres -d ecommerce_db -f /home/ivo/Projetos/e-commerce/01_create_database.sql
#     psql -U postgres -d ecommerce_db -f /home/ivo/Projetos/e-commerce/02_functions_triggers_views.
#   sql

#   3. Update application.properties:
#   Open application.properties and paste the configuration provided above. Replace postgres
#   credentials if your database user or password differs.
#   4. Run the Application:
#   Navigate to the application folder and start the application using Maven:
#     cd /home/ivo/Projetos/e-commerce/application
#     ./mvnw spring-boot:run

#   ──────
#   ### 📝 Notes

#   • Environment Variables: Credentials use defaults (postgres/postgres) but can be overridden by
#   environment variables DB_USERNAME and DB_PASSWORD.
#   • DDL Auto: Set spring.jpa.hibernate.ddl-auto=validate so Hibernate validates your entity mappings
#   against the tables created in 01_create_database.sql.